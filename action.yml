name: 'Zarf Package Helm Chart'
description: 'A GitHub Action to package Helm charts into Zarf packages for air-gapped deployment'
author: 'David Abrams <9200200@gmail.com>'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  chart_path:
    description: 'Path to the Helm chart directory (contains Chart.yaml)'
    required: true
  namespace:
    description: 'Kubernetes namespace for the Helm chart deployment'
    required: false
    default: 'default'
  package_name:
    description: 'Name for the Zarf package (defaults to chart name if not provided)'
    required: false
    default: ''
  package_version:
    description: 'Version for the Zarf package (defaults to chart version if not provided)'
    required: false
    default: ''
  images:
    description: 'Comma-separated list of container images to include (e.g., "nginx:1.25,postgres:15")'
    required: false
    default: ''
  values_file:
    description: 'Path to Helm values file for image extraction (relative to chart_path)'
    required: false
    default: ''
  architecture:
    description: 'Target architecture (amd64, arm64, or both)'
    required: false
    default: 'amd64'
  output_dir:
    description: 'Output directory for the Zarf package'
    required: false
    default: 'build'
  zarf_version:
    description: 'Version of Zarf CLI to install (default: latest)'
    required: false
    default: ''
  upload_artifact:
    description: 'Whether to upload generated packages as artifacts'
    required: false
    default: 'true'
  artifact_name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'zarf-packages'
  artifact_retention_days:
    description: 'Number of days to retain artifacts'
    required: false
    default: '30'

outputs:
  package_path:
    description: 'Path to the generated Zarf package'
    value: ${{ steps.build.outputs.package_path }}
  package_filename:
    description: 'Filename of the generated Zarf package'
    value: ${{ steps.build.outputs.package_filename }}
  architecture:
    description: 'Architecture of the generated package'
    value: ${{ inputs.architecture }}

runs:
  using: 'composite'
  steps:
    - name: Validate Architecture Input
      shell: bash
      run: |
        if [[ "${{ inputs.architecture }}" != "amd64" && "${{ inputs.architecture }}" != "arm64" && "${{ inputs.architecture }}" != "both" ]]; then
          echo "Error: architecture must be 'amd64', 'arm64', or 'both'"
          exit 1
        fi

    - name: Install Zarf CLI
      uses: zarf-dev/setup-zarf@v1
      with:
        version: ${{ inputs.zarf_version }}

    - name: Install yq
      shell: bash
      run: |
        # Install yq for YAML parsing
        if ! command -v yq &> /dev/null; then
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
        fi
        yq --version

    - name: Generate Zarf Configuration
      id: generate-zarf
      shell: bash
      run: |
        CHART_PATH="${{ inputs.chart_path }}"
        
        # Validate chart path exists
        if [ ! -d "$CHART_PATH" ]; then
          echo "Error: Chart path '$CHART_PATH' does not exist"
          exit 1
        fi
        
        # Check for Chart.yaml
        if [ ! -f "$CHART_PATH/Chart.yaml" ]; then
          echo "Error: No Chart.yaml found in '$CHART_PATH'"
          exit 1
        fi
        
        # Extract chart metadata from Chart.yaml
        CHART_NAME=$(yq eval '.name' "$CHART_PATH/Chart.yaml")
        CHART_VERSION=$(yq eval '.version' "$CHART_PATH/Chart.yaml")
        CHART_DESCRIPTION=$(yq eval '.description // ""' "$CHART_PATH/Chart.yaml")
        
        echo "Detected chart: $CHART_NAME v$CHART_VERSION"
        
        # Determine package name and version
        PACKAGE_NAME="${{ inputs.package_name }}"
        PACKAGE_VERSION="${{ inputs.package_version }}"
        if [ -z "$PACKAGE_NAME" ]; then
          PACKAGE_NAME="$CHART_NAME"
        fi
        if [ -z "$PACKAGE_VERSION" ]; then
          PACKAGE_VERSION="$CHART_VERSION"
        fi
        
        # Create build directory structure
        BUILD_DIR="${{ inputs.output_dir }}/zarf-build"
        mkdir -p "$BUILD_DIR"
        
        # Copy chart to build directory
        cp -r "$CHART_PATH" "$BUILD_DIR/chart"
        
        # Get images list for later
        IMAGES="${{ inputs.images }}"
        
        # Handle values file
        VALUES_FILE="${{ inputs.values_file }}"
        VALUES_YAML=""
        if [ -n "$VALUES_FILE" ]; then
          if [ -f "$CHART_PATH/$VALUES_FILE" ]; then
            cp "$CHART_PATH/$VALUES_FILE" "$BUILD_DIR/"
            VALUES_YAML="\n        valuesFiles:\n          - $(basename "$VALUES_FILE")"
          else
            echo "Warning: values file '$VALUES_FILE' not found, continuing without it"
          fi
        fi
        
        # Generate zarf.yaml
        cat > "$BUILD_DIR/zarf.yaml" << EOF
kind: ZarfPackageConfig
metadata:
  name: ${PACKAGE_NAME}
  description: "${CHART_DESCRIPTION:-Helm chart packaged for air-gapped deployment}"
  version: ${PACKAGE_VERSION}
components:
  - name: helm-chart
    required: true
    charts:
      - name: ${CHART_NAME}
        version: ${CHART_VERSION}
        namespace: ${{ inputs.namespace }}
        localPath: ./chart${VALUES_YAML}
EOF
        
        # Append images at component level if specified
        if [ -n "$IMAGES" ]; then
          cat >> "$BUILD_DIR/zarf.yaml" << EOF
    images:
EOF
          IFS=',' read -ra IMG_ARRAY <<< "$IMAGES"
          for img in "${IMG_ARRAY[@]}"; do
            trimmed=$(echo "$img" | xargs)
            if [ -n "$trimmed" ]; then
              echo "      - ${trimmed}" >> "$BUILD_DIR/zarf.yaml"
            fi
          done
        fi
        
        echo "Generated zarf.yaml:"
        cat "$BUILD_DIR/zarf.yaml"
        echo ""
        echo "build_dir=$BUILD_DIR" >> $GITHUB_OUTPUT
        echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

    - name: Build AMD64 Package
      id: build-amd64
      if: inputs.architecture == 'amd64' || inputs.architecture == 'both'
      shell: bash
      run: |
        echo "Building Zarf package for AMD64..."
        zarf package create \
          -o "${{ inputs.output_dir }}" \
          -a amd64 \
          "${{ steps.generate-zarf.outputs.build_dir }}" \
          --confirm
        # Find the generated package file
        package_file=$(ls -1 ${{ inputs.output_dir }}/zarf-package-*.tar.zst 2>/dev/null | head -n 1)
        if [ -n "$package_file" ]; then
          echo "package_path=${{ inputs.output_dir }}/$(basename $package_file)" >> $GITHUB_OUTPUT
          echo "package_filename=$(basename $package_file)" >> $GITHUB_OUTPUT
        fi
        echo "Generated AMD64 packages:"
        ls -lh ${{ inputs.output_dir }}/zarf-package-*-amd64-*.tar.zst 2>/dev/null || echo "No AMD64 packages found"

    - name: Build ARM64 Package
      id: build-arm64
      if: inputs.architecture == 'arm64' || inputs.architecture == 'both'
      shell: bash
      run: |
        echo "Building Zarf package for ARM64..."
        zarf package create \
          -o "${{ inputs.output_dir }}" \
          -a arm64 \
          "${{ steps.generate-zarf.outputs.build_dir }}" \
          --confirm
        echo "Generated ARM64 packages:"
        ls -lh ${{ inputs.output_dir }}/zarf-package-*-arm64-*.tar.zst 2>/dev/null || echo "No ARM64 packages found"

    - name: Set Output
      id: build
      shell: bash
      run: |
        # Determine the primary package path
        if [ -n "${{ steps.build-amd64.outputs.package_path }}" ]; then
          echo "package_path=${{ steps.build-amd64.outputs.package_path }}" >> $GITHUB_OUTPUT
          echo "package_filename=${{ steps.build-amd64.outputs.package_filename }}" >> $GITHUB_OUTPUT
        elif [ -n "${{ steps.build-arm64.outputs.package_path }}" ]; then
          echo "package_path=${{ steps.build-arm64.outputs.package_path }}" >> $GITHUB_OUTPUT
          echo "package_filename=${{ steps.build-arm64.outputs.package_filename }}" >> $GITHUB_OUTPUT
        fi
        echo "All generated packages:"
        ls -lh ${{ inputs.output_dir }}/zarf-package-*.tar.zst 2>/dev/null || echo "No packages found"

    - name: Upload Zarf Package Artifacts
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output_dir }}/zarf-package-*.tar.zst
        retention-days: ${{ inputs.artifact_retention_days }}
